spring:
  profiles:
    active: local
  session:
    store-type: redis
    timeout: 2592000
  #redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lu-ai-code
    username: root
    password: admin
  application:
    name: lu-ai-code
server:
  port: 8223
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.lu.luaicode.controller
# knife4j
knife4j:
  enable: false
  setting:
    language: zh_cn

